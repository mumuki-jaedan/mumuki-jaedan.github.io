<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <defs>
    <style>
      .t-title { font-family: 'Georgia', 'Noto Serif KR', serif; font-weight: 700; }
      .t-body { font-family: 'Helvetica Neue', 'Noto Sans KR', sans-serif; }
      .t-label { font-family: 'Helvetica Neue', 'Noto Sans KR', sans-serif; font-size: 10px; }
    </style>
  </defs>

  <rect width="640" height="480" fill="#F5F1EB"/>

  <text x="320" y="36" text-anchor="middle" class="t-title" font-size="20" fill="#2D3436">조직 구성</text>
  <text x="320" y="52" text-anchor="middle" class="t-label" fill="#636E72" font-style="italic">「사단법인 무무키 정관」 기준</text>
  <line x1="60" y1="62" x2="580" y2="62" stroke="#B2BEC3" stroke-width="0.5"/>

  <!-- Level 0: Members -->
  <g transform="translate(320, 96)">
    <rect x="-110" y="-18" width="220" height="36" rx="4" fill="#D4A574" fill-opacity="0.15" stroke="#D4A574" stroke-width="1"/>
    <text x="0" y="5" text-anchor="middle" class="t-body" font-size="12" fill="#8B6D42" font-weight="600">회원 &#183; 정회원 / 단체회원 / 후원회원</text>
    <text x="128" y="-2" class="t-label" fill="#636E72" font-style="italic">이사회 승인으로 가입</text>
    <text x="128" y="11" class="t-label" fill="#636E72" font-style="italic">후원회원은 의결권 없음</text>
  </g>

  <line x1="320" y1="114" x2="320" y2="140" stroke="#2C5F5C" stroke-width="1"/>

  <!-- Level 1: General Assembly -->
  <g transform="translate(320, 162)">
    <rect x="-90" y="-22" width="180" height="44" rx="4" fill="#2C5F5C" fill-opacity="0.12" stroke="#2C5F5C" stroke-width="1.4"/>
    <text x="0" y="0" text-anchor="middle" class="t-body" font-size="15" fill="#2C5F5C" font-weight="700">총회</text>
    <text x="0" y="15" text-anchor="middle" class="t-label" fill="#2C5F5C">최고 의결기관</text>
    <text x="106" y="-6" class="t-label" fill="#636E72" font-style="italic">임원 선출 &#183; 해임</text>
    <text x="106" y="7" class="t-label" fill="#636E72" font-style="italic">예산 &#183; 결산 &#183; 사업계획 승인</text>
    <text x="106" y="20" class="t-label" fill="#636E72" font-style="italic">정관 변경 &#183; 해산</text>
  </g>

  <line x1="320" y1="184" x2="320" y2="212" stroke="#2C5F5C" stroke-width="1"/>
  <line x1="180" y1="212" x2="500" y2="212" stroke="#2C5F5C" stroke-width="1"/>

  <!-- Level 2a: Board -->
  <line x1="180" y1="212" x2="180" y2="234" stroke="#2C5F5C" stroke-width="1"/>
  <g transform="translate(180, 260)">
    <rect x="-90" y="-22" width="180" height="44" rx="4" fill="#2C5F5C" fill-opacity="0.1" stroke="#2C5F5C" stroke-width="1.2"/>
    <text x="0" y="0" text-anchor="middle" class="t-body" font-size="14" fill="#2C5F5C" font-weight="700">이사회</text>
    <text x="0" y="15" text-anchor="middle" class="t-label" fill="#2C5F5C">이사장 1인 + 이사 4인 이상</text>
    <text x="-38" y="38" class="t-label" fill="#636E72" font-style="italic">업무 집행 &#183; 예산/결산서 작성</text>
    <text x="-38" y="51" class="t-label" fill="#636E72" font-style="italic">재산 관리 &#183; 총회 부의안건 작성</text>
  </g>

  <!-- Level 2b: Auditor -->
  <line x1="500" y1="212" x2="500" y2="234" stroke="#2C5F5C" stroke-width="1"/>
  <g transform="translate(500, 260)">
    <rect x="-80" y="-22" width="160" height="44" rx="4" fill="#E07A5F" fill-opacity="0.1" stroke="#E07A5F" stroke-width="1"/>
    <text x="0" y="0" text-anchor="middle" class="t-body" font-size="14" fill="#E07A5F" font-weight="700">감사</text>
    <text x="0" y="15" text-anchor="middle" class="t-label" fill="#E07A5F">1인 &#183; 임기 3년</text>
    <text x="0" y="38" text-anchor="middle" class="t-label" fill="#636E72" font-style="italic">외부 회계감사보고서</text>
    <text x="0" y="51" text-anchor="middle" class="t-label" fill="#636E72" font-style="italic">연차 발행(자발적 조치)</text>
  </g>

  <!-- Mutual check (dotted between board and auditor) -->
  <path d="M 272 250 Q 340 228, 418 250" stroke="#B2BEC3" stroke-width="0.8" fill="none" stroke-dasharray="3,3"/>
  <text x="345" y="232" text-anchor="middle" class="t-label" fill="#B2BEC3">상호 견제</text>

  <!-- Level 3: Secretariat -->
  <line x1="115" y1="282" x2="115" y2="330" stroke="#2C5F5C" stroke-width="0.8"/>
  <g transform="translate(180, 352)">
    <rect x="-80" y="-22" width="160" height="44" rx="4" fill="#2C5F5C" fill-opacity="0.06" stroke="#2C5F5C" stroke-width="1"/>
    <text x="0" y="0" text-anchor="middle" class="t-body" font-size="13" fill="#2C5F5C" font-weight="700">사무국</text>
    <text x="0" y="15" text-anchor="middle" class="t-label" fill="#2C5F5C">사무국장 1인 + 직원</text>
  </g>
  <text x="272" y="348" class="t-label" fill="#636E72" font-style="italic">이사회 의결을 거쳐 이사장이 임면</text>
  <text x="272" y="361" class="t-label" fill="#636E72" font-style="italic">발굴 프로젝트 기획 &#183; 분과 계획 수립 &#183; 집행</text>

  <!-- Bottom notes -->
  <line x1="60" y1="396" x2="580" y2="396" stroke="#B2BEC3" stroke-width="0.5"/>
  <g transform="translate(60, 414)">
    <text x="0" y="0" class="t-label" fill="#636E72" font-style="italic">* 임원(이사장 &#183; 이사 &#183; 감사)의 임기는 3년이며 연임할 수 있음</text>
    <text x="0" y="16" class="t-label" fill="#636E72" font-style="italic">* 정관 변경은 재적회원 2/3 이상, 해산은 3/4 이상의 찬성으로 총회에서 의결</text>
    <text x="0" y="32" class="t-label" fill="#636E72" font-style="italic">* 임원 명단은 설립허가 및 법인등기 완료 후 공개 예정</text>
  </g>

  <!-- Legend -->
  <g transform="translate(60, 464)">
    <rect x="0" y="-6" width="12" height="12" rx="2" fill="#D4A574" fill-opacity="0.15" stroke="#D4A574" stroke-width="0.8"/>
    <text x="18" y="4" class="t-label" fill="#2D3436">구성원</text>
    <rect x="80" y="-6" width="12" height="12" rx="2" fill="#2C5F5C" fill-opacity="0.1" stroke="#2C5F5C" stroke-width="0.8"/>
    <text x="98" y="4" class="t-label" fill="#2D3436">의결 &#183; 집행 조직</text>
    <rect x="200" y="-6" width="12" height="12" rx="2" fill="#E07A5F" fill-opacity="0.1" stroke="#E07A5F" stroke-width="0.8"/>
    <text x="218" y="4" class="t-label" fill="#2D3436">감사 조직</text>
  </g>
</svg>
