<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420">
  <defs>
    <style>
      .t-title { font-family: 'Georgia', 'Noto Serif KR', serif; font-weight: 700; }
      .t-body { font-family: 'Helvetica Neue', 'Noto Sans KR', sans-serif; }
      .t-label { font-family: 'Helvetica Neue', 'Noto Sans KR', sans-serif; font-size: 10px; }
    </style>
    <!-- 화살표 머리는 각 선의 색과 일치시킨다 -->
    <marker id="ah-teal" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto-start-reverse">
      <path d="M 0 0 L 7 2.5 L 0 5" fill="none" stroke="#2C5F5C" stroke-width="0.8"/>
    </marker>
    <marker id="ah-coral" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto-start-reverse">
      <path d="M 0 0 L 7 2.5 L 0 5" fill="none" stroke="#E07A5F" stroke-width="0.8"/>
    </marker>
    <marker id="ah-gold" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto-start-reverse">
      <path d="M 0 0 L 7 2.5 L 0 5" fill="none" stroke="#D4A574" stroke-width="0.8"/>
    </marker>
    <marker id="ah-gray" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto-start-reverse">
      <path d="M 0 0 L 7 2.5 L 0 5" fill="none" stroke="#8D9A9C" stroke-width="0.8"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#F5F1EB"/>

  <text x="40" y="36" class="t-title" font-size="20" fill="#2D3436">꼬리표 있는 기부 솔루션 정보 흐름</text>
  <text x="40" y="54" class="t-body" font-size="11" fill="#636E72" font-style="italic">참여자 간 정보 &#183; 기부금 흐름 구조</text>
  <line x1="40" y1="62" x2="600" y2="62" stroke="#B2BEC3" stroke-width="0.5"/>

  <!-- ── 참여자 ───────────────────────────────── -->

  <!-- 상단: 무무키 파운데이션 -->
  <g transform="translate(300, 110)">
    <rect x="-70" y="-26" width="140" height="52" rx="4" fill="#2C5F5C" fill-opacity="0.08" stroke="#2C5F5C" stroke-width="1.2"/>
    <text x="0" y="-4" text-anchor="middle" class="t-body" font-size="13" fill="#2C5F5C" font-weight="700">무무키 파운데이션</text>
    <text x="0" y="14" text-anchor="middle" class="t-label" fill="#636E72">중개 &#183; 매칭 &#183; 공시</text>
  </g>

  <!-- 좌측: 기부자 -->
  <g transform="translate(95, 250)">
    <rect x="-52" y="-22" width="104" height="44" rx="4" fill="none" stroke="#2C5F5C" stroke-width="1"/>
    <text x="0" y="-2" text-anchor="middle" class="t-body" font-size="13" fill="#2C5F5C" font-weight="600">기부자</text>
    <text x="0" y="14" text-anchor="middle" class="t-label" fill="#636E72">후원금 &#183; 재능</text>
  </g>

  <!-- 우측: 복지단체 / 수혜자 -->
  <g transform="translate(505, 250)">
    <rect x="-62" y="-22" width="124" height="44" rx="4" fill="none" stroke="#E07A5F" stroke-width="1"/>
    <text x="0" y="-2" text-anchor="middle" class="t-body" font-size="13" fill="#E07A5F" font-weight="600">복지단체 / 수혜자</text>
    <text x="0" y="14" text-anchor="middle" class="t-label" fill="#636E72">수요 &#183; 피드백</text>
  </g>

  <!-- 하단: mumuki.net -->
  <g transform="translate(300, 348)">
    <rect x="-62" y="-18" width="124" height="36" rx="4" fill="#D4A574" fill-opacity="0.12" stroke="#D4A574" stroke-width="1"/>
    <text x="0" y="0" text-anchor="middle" class="t-body" font-size="12" fill="#B98D4E" font-weight="600">mumuki.net</text>
    <text x="0" y="13" text-anchor="middle" class="t-label" fill="#636E72">공개 플랫폼</text>
  </g>

  <!-- ── 무파 ↔ 기부자 (평행 2선, 각각 화살표 머리 보유) ── -->

  <!-- 무파 → 기부자 : 매칭 알림 (정보) -->
  <line x1="232" y1="134" x2="152" y2="222" stroke="#2C5F5C" stroke-width="0.9" marker-end="url(#ah-teal)"/>
  <text x="150" y="168" text-anchor="middle" class="t-label" fill="#2C5F5C">매칭 알림</text>

  <!-- 기부자 → 무파 : 기부금 (자금) -->
  <line x1="167" y1="235" x2="247" y2="147" stroke="#D4A574" stroke-width="0.9" stroke-dasharray="4,3" marker-end="url(#ah-gold)"/>
  <text x="250" y="206" text-anchor="middle" class="t-label" fill="#B98D4E">기부금</text>

  <!-- ── 무파 ↔ 복지단체/수혜자 (평행 2선) ── -->

  <!-- 무파 → 복지단체 : 지원 · 전달 -->
  <line x1="368" y1="134" x2="448" y2="222" stroke="#E07A5F" stroke-width="0.9" marker-end="url(#ah-coral)"/>
  <text x="462" y="168" text-anchor="middle" class="t-label" fill="#E07A5F">지원 &#183; 전달</text>

  <!-- 복지단체 → 무파 : 수요 신청 -->
  <line x1="433" y1="235" x2="353" y2="147" stroke="#8D9A9C" stroke-width="0.9" stroke-dasharray="4,3" marker-end="url(#ah-gray)"/>
  <text x="350" y="206" text-anchor="middle" class="t-label" fill="#636E72">수요 신청</text>

  <!-- ── 무파 → mumuki.net : 회계 공시 ── -->
  <line x1="300" y1="136" x2="300" y2="326" stroke="#D4A574" stroke-width="0.9" stroke-dasharray="4,3" marker-end="url(#ah-gold)"/>
  <rect x="278" y="228" width="66" height="16" fill="#F5F1EB"/>
  <text x="311" y="240" text-anchor="middle" class="t-label" fill="#B98D4E">회계 공시</text>

  <!-- ── 기부자 ↔ 복지단체 : 수평적 관계 (양방향) ── -->
  <path d="M 152 272 Q 300 312, 448 272" stroke="#D4A574" stroke-width="1.2" fill="none" stroke-dasharray="6,3"
        marker-start="url(#ah-gold)" marker-end="url(#ah-gold)"/>
  <text x="300" y="308" text-anchor="middle" class="t-label" fill="#B98D4E" font-weight="600">수평적 관계 (다이렉트)</text>

  <!-- ── 범례 ───────────────────────────────── -->
  <g transform="translate(40, 400)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#2C5F5C" stroke-width="1" marker-end="url(#ah-teal)"/>
    <text x="28" y="4" class="t-label" fill="#636E72">정보 전달</text>
    <line x1="110" y1="0" x2="130" y2="0" stroke="#D4A574" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#ah-gold)"/>
    <text x="138" y="4" class="t-label" fill="#636E72">기부금 &#183; 공시</text>
    <line x1="240" y1="0" x2="260" y2="0" stroke="#8D9A9C" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#ah-gray)"/>
    <text x="268" y="4" class="t-label" fill="#636E72">수요 신청</text>
    <line x1="360" y1="0" x2="380" y2="0" stroke="#E07A5F" stroke-width="1" marker-end="url(#ah-coral)"/>
    <text x="388" y="4" class="t-label" fill="#636E72">지원 &#183; 전달</text>
  </g>
</svg>
